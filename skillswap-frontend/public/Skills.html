<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        min-height: 100vh;
    }

    .skills-page { padding: 20px; }

    .page-title { font-size: 28px; color: #2c3e50; margin-bottom: 10px; }
    .page-subtitle { color: #7f8c8d; margin-bottom: 20px; }

    .search-container { max-width: 600px; margin-bottom: 30px; position: relative; }
    .search-bar {
        width: 100%; padding: 12px 20px 12px 45px;
        border: 2px solid #ddd; border-radius: 25px; font-size: 16px;
        transition: .3s;
    }
    .search-bar:focus { border-color: #3498db; box-shadow: 0 0 0 3px #3498db33; }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #7f8c8d; }

    /* GRID */
    .skills-grid {
        display: grid; gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    /* Cards */
    .skill-card {
        background: #fff; border-radius: 10px; border: 1px solid #eee;
        box-shadow: 0 5px 15px #0001; transition: .3s;
    }
    .skill-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px #0002; }

    .skill-card-header {
        padding: 20px; display: flex; gap: 15px; align-items: center;
        background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    }

    .skill-icon {
        width: 50px; height: 50px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; color: #fff;
    }

    .skill-title { font-size: 20px; font-weight: 600; color: #2c3e50; }
    .skill-level { font-size: 14px; color: #7f8c8d; margin-top: 5px; }

    .skill-content { padding: 15px 20px; min-height: 120px; line-height: 1.6; color: #5d6d7e; border-bottom: 1px solid #eee; }

    .skill-stats, .skill-actions { padding: 15px 20px; display: flex; justify-content: space-between; gap: 10px; }

    .skill-btn {
        flex: 1; padding: 10px 20px; border-radius: 6px; border: none;
        font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center;
        gap: 8px; transition: .3s;
    }
    .btn-primary { background: #3498db; color: #fff; }
    .btn-primary:hover { background: #2980b9; }
    .btn-primary:disabled { background: #95a5a6; }

    /* Modal */
    .test-modal {
        display: none; position: fixed; inset: 0;
        background: #0008; z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-content {
        background: #fff; width: 90%; max-width: 800px;
        border-radius: 15px; overflow: hidden; animation: fade .3s;
        box-shadow: 0 20px 50px #0004;
    }
    @keyframes fade { from {opacity: 0; transform: translateY(-50px);} to {opacity: 1;} }

    .modal-header {
        padding: 20px; display: flex; justify-content: space-between; align-items: center;
        background: linear-gradient(90deg, #3498db, #2c3e50); color: #fff;
    }
    .close-modal { background: none; border: none; font-size: 28px; color: #fff; cursor: pointer; }

    .modal-body { padding: 25px; max-height: 70vh; overflow-y: auto; }
    .question { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
    .question-text { font-size: 17px; margin-bottom: 15px; font-weight: 500; color: #2c3e50; }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
        padding: 12px; border: 2px solid #ecf0f1; border-radius: 6px;
        cursor: pointer; transition: .2s;
    }
    .option:hover { background: #f8f9fa; }
    .option.selected { background: #ebf5fb; border-color: #3498db; }

    .modal-footer {
        padding: 15px 25px; background: #f8f9fa;
        display: flex; justify-content: space-between; align-items: center;
    }

    .modal-btn {
        padding: 10px 25px; background: #3498db; border: none;
        border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer;
    }
    .modal-btn-secondary { background: #95a5a6; }
    .modal-btn-secondary:hover { background: #7f8c8d; }

    .score-circle { font-size: 70px; font-weight: 700; margin-bottom: 20px; }
    .score-excellent { color: #27ae60; }
    .score-good { color: #f39c12; }
    .score-average { color: #e74c3c; }

    .recommendation { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 20px; }
    .timer { padding: 5px 10px; border-radius: 20px; background: #2c3e50; color: #fff; font-size: 14px; }
</style>
</head>

        // Filter skills based on search
        function filterSkills(searchTerm) {
            const cards = document.querySelectorAll('.skill-card');
            cards.forEach(card => {
                const title = card.querySelector('.skill-title').textContent.toLowerCase();
                const desc = card.querySelector('.skill-content').textContent.toLowerCase();
                
                if (title.includes(searchTerm) || desc.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Setup event listeners
        function setupEventListeners() {
            // Close modal button
            document.getElementById('closeModal').addEventListener('click', function() {
                if (confirm("Are you sure you want to quit the test? Your progress will be lost.")) {
                    clearInterval(testTimer);
                    document.getElementById('testModal').style.display = 'none';
                }
            });
            
            // Close modal on outside click
            window.addEventListener('click', function(e) {
                const modal = document.getElementById('testModal');
                if (e.target === modal) {
                    if (confirm("Are you sure you want to quit the test? Your progress will be lost.")) {
                        clearInterval(testTimer);
                        modal.style.display = 'none';
                    }
                }
            });
            
            // Navigation buttons
            document.getElementById('nextQuestion').addEventListener('click', nextQuestion);
            document.getElementById('prevQuestion').addEventListener('click', prevQuestion);
            document.getElementById('submitTest').addEventListener('click', submitTest);
        }

        // Start test timer
        function startTimer() {
            clearInterval(testTimer);
            timeLeft = 60 * 60; // 60 minutes
            
            testTimer = setInterval(function() {
                timeLeft--;
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                
                document.getElementById('timer').textContent = 
                    `Time: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(testTimer);
                    submitTest();
                }
            }, 1000);
        }

        // Start test for a skill
        function startTest(skillName, skillId) {
            currentTest.skill = skillName;
            currentTest.skillId = skillId;
            currentTest.questions = testQuestions[skillName];
            currentTest.answers = {};
            currentTest.currentQuestion = 0;
            currentTest.startTime = new Date().toISOString();
            
            document.getElementById('modalTitle').textContent = `${skillName} Test`;
            showQuestion(0);
            document.getElementById('testModal').style.display = 'flex';
            
            // Start timer
            startTimer();
        }

        // Show question in modal
        function showQuestion(index) {
            const question = currentTest.questions[index];
            const modalBody = document.getElementById('modalBody');
            const progressText = document.getElementById('progressText');
            const prevBtn = document.getElementById('prevQuestion');
            const nextBtn = document.getElementById('nextQuestion');
            const submitBtn = document.getElementById('submitTest');
            
            let optionsHtml = '';
            question.options.forEach((option, optIndex) => {
                const isSelected = currentTest.answers[question.id] === optIndex;
                optionsHtml += `
                    <div class="option ${isSelected ? 'selected' : ''}" data-option="${optIndex}">
                        ${String.fromCharCode(65 + optIndex)}. ${option}
                    </div>
                `;
            });
            
            modalBody.innerHTML = `
                <div class="question">
                    <div class="question-difficulty difficulty-${question.difficulty}">
                        ${question.difficulty.toUpperCase()} LEVEL
                    </div>
                    <div class="question-text">${question.text}</div>
                    <div class="options">
                        ${optionsHtml}
                    </div>
                </div>
            `;
            
            progressText.textContent = `Question ${index + 1} of 30`;
            
            // Update navigation buttons
            prevBtn.style.display = index > 0 ? 'block' : 'none';
            
            if (index === currentTest.questions.length - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'block';
            } else {
                nextBtn.style.display = 'block';
                submitBtn.style.display = 'none';
            }
            
            // Add click events to options
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', function() {
                    const selectedOption = parseInt(this.getAttribute('data-option'));
                    currentTest.answers[question.id] = selectedOption;
                    
                    // Update UI
                    document.querySelectorAll('.option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    this.classList.add('selected');
                });
            });
            
            currentTest.currentQuestion = index;
        }

        // Next question
        function nextQuestion() {
            if (currentTest.currentQuestion < currentTest.questions.length - 1) {
                currentTest.currentQuestion++;
                showQuestion(currentTest.currentQuestion);
            }
        }

        // Previous question
        function prevQuestion() {
            if (currentTest.currentQuestion > 0) {
                currentTest.currentQuestion--;
                showQuestion(currentTest.currentQuestion);
            }
        }

       // Submit test and show results
function submitTest() {
    clearInterval(testTimer);
    
    // Calculate score - DEFINE variables FIRST!
    let correct = 0;
    let easyCorrect = 0;
    let mediumCorrect = 0;
    let hardCorrect = 0;
    
    // Loop through questions to calculate scores
    currentTest.questions.forEach(q => {
        if (currentTest.answers[q.id] === q.correct) {
            correct++;
            if (q.difficulty === 'easy') easyCorrect++;
            if (q.difficulty === 'medium') mediumCorrect++;
            if (q.difficulty === 'hard') hardCorrect++;
        }
    });
    
    const score = Math.round((correct / currentTest.questions.length) * 100);
    currentTest.endTime = new Date().toISOString();
    
    // Save user score to localStorage
    saveUserScore(currentTest.skillId, score);
    
    // Create test result object
    const testResult = {
        userId: currentUser.id,
        userName: currentUser.name.trim() || "User",
        userEmail: currentUser.email,
        skillId: currentTest.skillId,
        skillName: currentTest.skill,
        score: score,
        totalQuestions: 30,
        correctAnswers: correct,
        easyCorrect: easyCorrect,
        mediumCorrect: mediumCorrect,
        hardCorrect: hardCorrect,
        startTime: currentTest.startTime,
        endTime: currentTest.endTime,
        testDate: new Date().toISOString(),
        answers: currentTest.answers
    };
    
    // ONLY SAVE TO DATABASE IF SCORE >= 80%
    if (score >= 80) {
        console.log(' Score >=80%, saving to database with user:', currentUser.email);
        saveTestResultToDatabase(testResult);
        
        // Add message about saving to explore page
        var exploreMessage = '<p style="color: #27ae60; font-weight: bold;"> Your score will appear in Explore page!</p>';
    } else {
        console.log(' Score below 80%, not saving to database');
        var exploreMessage = '<p style="color: #7f8c8d;">Score 80%+ to get featured in Explore page</p>';
    }
    
    // Show results with the correct variables
    showResults(score, correct, easyCorrect, mediumCorrect, hardCorrect, testResult, exploreMessage);
}

    let scoreClass = 'score-average';

    else if (score >= 60) scoreClass = 'score-good';
